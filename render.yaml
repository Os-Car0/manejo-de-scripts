services:
  - type: web
    name: sistema-gestion-tareas
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: DATA_FILE
        value: /app/data/tasks.json
